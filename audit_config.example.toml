# Copy locally as audit_config.toml. Never put a password or token here.
host = "IP_Z_APLIKACIE"
port = 8181
account = "anyword"
password_env = "SPINQ_AUDIT_PASSWORD"
active_enabled = false
# Fill these only after documented operator review of real limits.
