# Finite real-hardware research plan. Run unchanged first. The software plan
# bounds below are NOT manufacturer/device operating limits. No calibration,
# gradient, shim or firmware write is attempted.
host = "172.19.20.100"
port = 8181
account = "anyword"
password_env = "SPINQ_AUDIT_PASSWORD"
baseline_verified = true
historical_baseline_only = false
bounded_study_enabled = true
hardware_lock_path = "~/.spinq_live_gemini.lock"

[operation]
repeat_count = 10
max_experiments = 40
pause_seconds = 10
timeout_seconds = 180
status_max_age_seconds = 120
queue_max_age_seconds = 120
# This live-run preset assumes that you have reserved this instrument for the
# run. Set false if others may submit jobs; then a fresh empty queue is required.
exclusive_use_confirmed = true

[baseline]
# Values previously used by spinq_lab_control.py, not a safety approval.
h_width_us = 40.0
h_amplitude_pct = 100.0
h_phase_deg = 90.0
h_detuning_hz = 0.0
sample_path = 0
sample_frequency_hz = 10000
sample_count = 16000
sample_delay_us = 0
# Exact numeric SDK field sent before. Official docs say seconds; SDK source
# describes microseconds, so the unit is unresolved. Do not vary this value.
relaxation_delay_value = 15.0
make_pps = true

[deltas]
# Small test changes around the earlier completed 40 µs measurement.
# The code enforces a finite study envelope and a 1500 µs requested RF budget.
amplitude_pct = 2.0
phase_deg = 5.0
width_us = 2.0
detuning_hz = 10.0
frequency_shift = 10
demod_shift = 10
sample_frequency_hz = 10000
sample_count = 1000
sample_delay_us = 100
relaxation_delay_value = 1.0
rabi_width_us = 2.0

[features]
# "verified" here means the SDK field meaning is documented enough to test;
# the physical effect is determined only by the returned live measurement.
multi_segment_verified = true
frequency_shift_verified = true
demod_shift_verified = true
sampling_variants_verified = true
relaxation_variant_verified = false
state_initialization_off_verified = false
p_channel_verified = false
no_rf_verified = false
rabi_scan_verified = true

# Add [phosphorus_baseline] with width_us, amplitude_pct, phase_deg,
# detuning_hz after a P-channel working point is established.

[limits]
# Not used by bounded_study_enabled=true. These optional fields are for a
# separate site-approved operating-envelope mode, if such limits become known.
# Fill with documented local operating limits; never infer from this preset.
# Do not copy Python validator maxima and call them safety limits.
# max_pulse_amplitude_pct = ...
# max_single_pulse_width_us = ...
# max_requested_rf_us_per_task = ...
# max_cumulative_requested_rf_us = ...
# min_relaxation_value = ...
# max_relaxation_value = ...
# max_sample_count = ...
# max_sample_frequency_hz = ...
# max_sample_delay_us = ...
# max_abs_detuning_hz = ...
# max_abs_frequency_shift = ...
# max_abs_demod_shift = ...
# min_temperature_c = ...
# max_temperature_c = ...
